name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the locked 100-document reference fixture
        run: python -B tools/build_acceptance_fixture.py --check
      - name: Run all runtime and CSV/batch regression tests
        env:
          NEURON_EVIDENCE_DIR: ${{ runner.temp }}/evidence-${{ matrix.python-version }}
        run: python -B -m unittest discover -s tests -t . -v
      - name: Test release guards without any network or publishing
        run: python -B .github/workflows/test_release_support.py -v
      - name: Compile source and notebook cells
        run: |
          python -B - <<'PY'
          import ast
          import json
          from pathlib import Path
          paths = list(Path('neuron_flow').glob('*.py')) + list(Path('tools').glob('*.py'))
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          notebook = json.loads(Path('START_COLAB.ipynb').read_text(encoding='utf-8'))
          cells = [cell for cell in notebook['cells'] if cell['cell_type'] == 'code']
          for index, cell in enumerate(cells):
              ast.parse(''.join(cell['source']), filename=f'notebook-cell-{index}')
          print(f'Parsed {len(paths)} Python files and {len(cells)} notebook code cells. This is not actual Colab acceptance.')
          PY

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt '.[documents]'
      - name: Install local OCR for adapter coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-tha
      - name: Check documentation claims
        run: python -B tools/check_repository_docs.py
      - name: Measure branch coverage and run static quality gates
        run: python -B tools/check_quality.py --output-dir "$RUNNER_TEMP/quality"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/quality/
          if-no-files-found: error

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked build tools and record versions
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip list --format=json
      - name: Build and install both Python distributions outside checkout
        run: python -B tools/check_distribution.py --output-dir "$RUNNER_TEMP/distribution"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distribution-${{ matrix.python-version }}
          path: ${{ runner.temp }}/distribution/
          if-no-files-found: error

  platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate CSV, money verification, SQLite cursors and CLI recovery
        run: python -B tools/platform_smoke.py
