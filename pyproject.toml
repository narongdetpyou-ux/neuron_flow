[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-flow-prototype"
version = "0.4.0"
description = "Supervised purchase document intake and validation with persistent recovery"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
maintainers = [{name = "narongdetpyou-ux"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
pdf = ["pypdf>=6.10,<7"]
excel = ["openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]
ocr = ["Pillow>=11,<14", "pypdfium2>=5,<6", "pypdf>=6.10,<7"]
s3 = ["boto3>=1.40,<2"]
documents = ["pypdf>=6.10,<7", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1",
             "Pillow>=11,<14", "pypdfium2>=5,<6", "boto3>=1.40,<2"]

[project.urls]
Repository = "https://github.com/narongdetpyou-ux/neuron_flow"
Issues = "https://github.com/narongdetpyou-ux/neuron_flow/issues"
Documentation = "https://github.com/narongdetpyou-ux/neuron_flow#readme"

[project.scripts]
neuron-flow = "neuron_flow.__main__:main"

[tool.setuptools.packages.find]
include = ["neuron_flow*"]
