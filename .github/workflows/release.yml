name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to verify and build'
        required: true
        type: string
      expected_commit:
        description: 'Exact lowercase 40-character commit SHA approved for this run'
        required: true
        type: string
      publish:
        description: 'Publish after checks; requires committed approval for this version'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REQUESTED_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      PUBLICATION_REQUESTED: ${{ inputs.publish }}
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Define isolated output paths
        run: |
          printf 'PACKAGE_DIR=%s/release-package\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'NEURON_EVIDENCE_DIR=%s/release-test-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check tag, exact commit, version and requested approval
        id: source
        shell: bash
        run: |
          publish_options=()
          if [[ "$PUBLICATION_REQUESTED" == true ]]; then
            publish_options+=(--publish)
          fi
          python -B .github/workflows/release_support.py validate \
            --tag "$REQUESTED_TAG" --expected-commit "$EXPECTED_COMMIT" "${publish_options[@]}"
      - name: Verify locked answers and all regressions
        run: |
          python -B tools/build_acceptance_fixture.py --check
          python -B -m unittest discover -s tests -t . -v
          python -B .github/workflows/test_release_support.py -v
      - name: Install hash-locked Python build tools
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip list --format=json
      - name: Verify wheel and sdist installation with local provenance
        run: python -B tools/check_distribution.py --output-dir "$RUNNER_TEMP/python-distribution"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distribution-${{ steps.source.outputs.commit }}
          path: ${{ runner.temp }}/python-distribution/
          if-no-files-found: error
      - name: Build and verify the package in a fresh extraction
        shell: bash
        run: |
          build_options=(--candidate)
          if [[ "$PUBLICATION_REQUESTED" == true ]]; then
            build_options=()
          fi
          build_log="$RUNNER_TEMP/neuron-package-build.log"
          if python -B tools/build_delivery.py --output-dir "$PACKAGE_DIR" "${build_options[@]}" > "$build_log" 2>&1; then
            cat "$build_log"
          else
            build_status=$?
            cat "$build_log"
            python - "$build_log" <<'PY'
          from pathlib import Path
          import sys
          message = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')[-48000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Package build failed::' + message)
          PY
            exit "$build_status"
          fi
      - name: Prepare exact assets and publication attestation
        shell: bash
        run: |
          publish_options=()
          if [[ "$PUBLICATION_REQUESTED" == true ]]; then
            publish_options+=(--publish)
          fi
          python -B .github/workflows/release_support.py bundle \
            --tag "$REQUESTED_TAG" --expected-commit "$EXPECTED_COMMIT" \
            --directory "$PACKAGE_DIR" "${publish_options[@]}"
      - name: Name the verified build artifact
        id: artifact
        env:
          VERIFIED_VERSION: ${{ steps.source.outputs.version }}
          VERIFIED_COMMIT: ${{ steps.source.outputs.commit }}
        run: echo "name=neuron-flow-${VERIFIED_VERSION}-${VERIFIED_COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
          retention-days: 14
      - name: Record candidate result
        if: ${{ !inputs.publish }}
        run: echo 'Candidate verified and saved as a workflow artifact. Nothing was published.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Define isolated output path
        run: printf 'PACKAGE_DIR=%s/release-package\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ env.PACKAGE_DIR }}
      - name: Verify, upload without overwriting, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -B source/.github/workflows/release_support.py publish \
            --directory "$PACKAGE_DIR" --expected-commit "$EXPECTED_COMMIT" \
            --repository "$GH_REPO"
      - name: Record publication result
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
