[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-flow-prototype"
version = "0.1.0"
description = "Five-component supervised workflow prototype with persistent recovery"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
neuron-flow = "neuron_flow.__main__:main"

[tool.setuptools.packages.find]
include = ["neuron_flow*"]
